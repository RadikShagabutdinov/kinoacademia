<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0C0A10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Спасибо Киноакадемии!</title>
    <!-- Проставляем тему до первой отрисовки: initTheme() из main.tsx отрабатывает
         уже после первого кадра, и без этого светлая тема мигала бы тёмной базой. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ka-theme');
          var mode = raw ? JSON.parse(raw).state.mode : 'dark';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
