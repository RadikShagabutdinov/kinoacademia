name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образа для выката (например v0.1.0 или latest)'
        required: true
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_api: ${{ steps.meta.outputs.image_api }}
      image_web: ${{ steps.meta.outputs.image_web }}
    steps:
      - uses: actions/checkout@v4

      # Имена образов в GHCR обязаны быть в нижнем регистре, а owner — нет.
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=${{ inputs.tag || github.ref_name }}"
            echo "image_api=${{ env.REGISTRY }}/$owner/kinoacademia-api"
            echo "image_web=${{ env.REGISTRY }}/$owner/kinoacademia-web"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image_api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # VITE_* не задаём: фронт и API живут на одном домене, поэтому нужны
      # относительный /api и wss://<текущий host>/ws — это поведение по умолчанию.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # .env.prod живёт только на сервере и не перезаписывается — сюда едут
      # лишь версионируемые описания стека.
      - name: Copy stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'docker-compose.prod.yml,Caddyfile'
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TAG,GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ secrets.PROD_DOMAIN }}/health/ready"; then
              echo "\nprod is healthy"
              exit 0
            fi
            echo "attempt $i failed, retrying in 5s"
            sleep 5
          done
          echo "health check never returned 200 — откат: TAG=<предыдущий тег> docker compose -f docker-compose.prod.yml --env-file .env.prod up -d"
          exit 1
